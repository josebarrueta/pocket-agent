[package]
name = "pocket-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A transport-neutral harness for isolated coding agents"
license = "MIT"
repository = "https://github.com/josebarrueta/pocket-agent"
homepage = "https://github.com/josebarrueta/pocket-agent"
readme = "README.md"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "pocket-agent"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "=0.3.41", features = ["formatting"] }
tokio = { version = "1.44", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.16", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
