services:
  signal-cli:
    build:
      context: .
      dockerfile: docker/signal-cli/Dockerfile
      target: runtime
    image: pocket-agent/signal-cli:0.13.20
    # Upstream's checksum-verified native release is x86-64. Docker Desktop
    # emulates it on Apple Silicon; remove this only when using an arm64 build.
    platform: linux/amd64
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      # signal-cli extracts its ~121 MiB libsignal bundle and loads it here.
      - /tmp:rw,nosuid,nodev,exec,size=160m,mode=1777
    volumes:
      - ./signal-cli-data:/var/lib/signal-cli

  # One-off setup image. It adds only qrencode and a shell, prints a linking QR,
  # and exits. The long-running signal-cli service uses the minimal scratch image.
  signal-link:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: docker/signal-cli/Dockerfile
      target: link-helper
    image: pocket-agent/signal-cli-link:0.13.20
    platform: linux/amd64
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=160m,mode=1777
    volumes:
      - ./signal-cli-data:/var/lib/signal-cli
