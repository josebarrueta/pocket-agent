name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt --no-self-update
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.88.0 test --locked
      - name: Build and measure stripped trusted host
        run: |
          cargo +1.88.0 build --locked --release
          size="$(stat --format='%s' target/release/pocket-agent)"
          echo "Stripped pocket-agent binary: ${size} bytes"
          test "$size" -le 15728640

  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build supported worker platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: IMAGE_REVISION=${{ github.sha }}
      - name: Load worker image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pocket-agent/worker:test
          build-args: IMAGE_REVISION=${{ github.sha }}
      - name: Smoke test hardened runtime
        run: |
          set -euo pipefail
          output="$(docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            pocket-agent/worker:test --smoke-test)"
          python3 -c 'import json,sys; value=json.loads(sys.argv[1]); assert value["ok"] and value["uid"] == 65532 and value["gid"] == 65532 and value["piVersion"] == "0.87.1"' "$output"

          if docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m --network none pocket-agent/worker:test sh; then
            echo "worker accepted a command-line entrypoint override" >&2
            exit 1
          fi
          if printf 'not-json\n' | docker run --rm -i --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m --network none pocket-agent/worker:test; then
            echo "worker accepted malformed input" >&2
            exit 1
          fi
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - name: Build Docker runner fixture
        run: docker build --build-arg BASE_IMAGE=pocket-agent/worker:test --file tests/fixtures/docker-worker/Dockerfile --tag pocket-agent/worker-fixture:test .
      - name: Test Rust Docker job adapter
        env:
          POCKET_AGENT_DOCKER_TEST_IMAGE: pocket-agent/worker:test
          POCKET_AGENT_DOCKER_FIXTURE_IMAGE: pocket-agent/worker-fixture:test
          POCKET_AGENT_DOCKER_PATH: /usr/bin/docker
          POCKET_AGENT_TAR_PATH: /usr/bin/tar
        run: cargo +1.88.0 test --locked --test rust_docker -- --test-threads=1
